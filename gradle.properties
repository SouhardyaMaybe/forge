# CI runs on GitHub's 4-core/16GB public runner. D8 dexing this dependency set
# (Compose + Navigation3 + the Ktor backend stack) needs more than ~2 GB, so the
# daemon gets 5 GB and worker processes inherit that cap. Kotlin compilation
# stays in-process to avoid a third JVM competing for RAM.
org.gradle.jvm.args=-Xmx5g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
