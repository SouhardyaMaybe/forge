# The CI runner is 2 CPUs / 7.8 GB RAM (6.5 GB usable). Gradle worker
# processes inherit the daemon's heap settings, so the daemon heap bounds the
# dexing worker too. 2 GB keeps daemon + D8 worker inside the RAM budget;
# the in-process Kotlin compile and single worker keep everything else out of
# the picture.
org.gradle.jvm.args=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
