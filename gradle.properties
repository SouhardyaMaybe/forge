# CI runs on GitHub's 4-core/16GB public runner.
#
# Strategy: strictly sequential execution (parallel=false, one worker) so the
# daemon, the Kotlin compiler and the D8 worker are never all resident at once.
# D8 workers inherit the daemon heap, so the daemon cap is the dexing cap.
org.gradle.jvm.args=-Xmx6g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
