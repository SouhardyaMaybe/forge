# CI runs on GitHub's 4-core/16GB public runner.
#
# The Gradle daemon gets 5 GB (worker processes, including D8, inherit that
# cap). Kotlin compilation runs in its own daemon with 3 GB: compiling
# in-process made the compiler compete with the daemon's heap.
org.gradle.jvm.args=-Xmx5g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
