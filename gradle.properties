org.gradle.jvm.args=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true

# Keep every compilation in the daemon process: a second Kotlin daemon costs
# ~1 GB of the runner's RAM, which the D8 dexing worker needs.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
