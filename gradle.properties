# CI runs on GitHub's 4-core/16GB public runner.
#
# Strategy: strictly sequential execution (parallel=false, one worker). With
# parallelism, the Gradle daemon, the Kotlin compiler and the D8 worker can all
# be resident at once and their combined heaps exceed the machine. Sequential
# execution means only one heavy process is live at a time, so a 4 GB daemon
# cap is enough for both compilation and dexing (D8 workers inherit it).
org.gradle.jvm.args=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
