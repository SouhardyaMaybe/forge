name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble online debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$(ls -1 "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          ( set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 ) || true
          ( set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358" )

      # The online edition ships without runtime bundles: the tarballs are
      # release assets of the upstream project (MIT), referenced by
      # dist/runtime-bundles/manifest.json. The build only needs the shared
      # agent bundle; the rest downloads on first launch.
      - name: Fetch runtime bundle assets
        run: |
          set -euo pipefail
          mkdir -p dist/runtime-bundles
          BASE="https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4"
          for f in $(python3 -c "
          import json
          m = json.load(open('dist/runtime-bundles/manifest.json'))
          print(' '.join(b['file'] for b in m['bundles'].values()))
          "); do
            echo "downloading $f"
            curl -sSL -o "dist/runtime-bundles/$f" "$BASE/$f"
          done
          ls -la dist/runtime-bundles/ | head

      - name: Report runner resources
        run: |
          echo "== CPUs ==" ; nproc
          echo "== Memory ==" ; free -h

      - name: Assemble
        # D8/R8 occasionally hit the shared runner's memory ceiling; retry.
        run: |
          for attempt in 1 2 3; do
            echo "::group::assembleOnlineDebug attempt $attempt"
            if ./gradlew :app:assembleOnlineDebug --no-daemon --console=plain --stacktrace; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed; backing off 20s"
            sleep 20
          done
          exit 1

      - name: Unit tests
        run: ./gradlew :app:testOnlineDebugUnitTest --no-daemon --console=plain || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-debug-apk
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
